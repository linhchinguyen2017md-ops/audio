<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trình Đọc Audio & Luyện Thi (Mặc định 0.6x)</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-hover: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0284c7;
      --exam: #f59e0b;
      --exam-bg: rgba(245, 158, 11, 0.12);
      --danger: #ef4444;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 18px 14px 40px;
    }

    .container {
      width: 100%;
      max-width: 760px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      height: fit-content;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .header h1 {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .mode-switch {
      display: flex;
      background: #0f172a;
      padding: 4px;
      border-radius: 10px;
      border: 1px solid var(--border);
    }

    .mode-switch button {
      border: none;
      background: transparent;
      padding: 6px 14px;
      font-size: 0.85rem;
      border-radius: 7px;
      color: var(--muted);
    }

    .mode-switch button.active-normal {
      background: var(--accent);
      color: #0f172a;
    }

    .mode-switch button.active-exam {
      background: var(--exam);
      color: #0f172a;
    }

    /* Khung Chức Năng Thi */
    .exam-panel {
      display: none;
      background: var(--exam-bg);
      border: 1px solid var(--exam);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
    }

    .exam-panel.visible {
      display: block;
    }

    .exam-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .exam-title {
      color: var(--exam);
      font-weight: 700;
      font-size: 0.95rem;
    }

    .exam-timer {
      font-family: monospace;
      font-size: 1.15rem;
      font-weight: 700;
      background: #0f172a;
      color: var(--exam);
      padding: 4px 12px;
      border-radius: 8px;
      border: 1px solid var(--exam);
    }

    .exam-timer.warning {
      color: var(--danger);
      border-color: var(--danger);
    }

    .exam-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }

    .exam-field {
      background: #0f172a;
      padding: 9px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.84rem;
    }

    .exam-field label {
      display: block;
      color: var(--muted);
      margin-bottom: 4px;
      font-size: 0.78rem;
    }

    .exam-field input, .exam-field select {
      width: 100%;
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 6px 8px;
      border-radius: 6px;
      font-size: 0.88rem;
    }

    .exam-options {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 0.83rem;
      color: var(--text);
      margin-bottom: 10px;
    }

    .exam-options label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    .exam-actions {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    .exam-stats {
      font-size: 0.85rem;
      color: var(--exam);
      font-weight: 600;
    }

    button.btn-exam {
      background: var(--exam);
      color: #0f172a;
      border-color: var(--exam);
    }

    button.btn-exam:hover {
      background: #d97706;
      color: #fff;
    }

    /* Trình phát chính - Ghim khi cuộn */
    .now-playing {
      position: sticky;
      top: 10px;
      z-index: 20;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45);
    }

    .track-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .track-title {
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      word-break: break-word;
    }

    .unlimited-badge {
      font-size: 0.72rem;
      background: rgba(56, 189, 248, 0.15);
      color: var(--accent);
      padding: 3px 8px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .progress-container {
      margin-bottom: 10px;
    }

    input[type="range"] {
      width: 100%;
      accent-color: var(--accent);
      cursor: pointer;
    }

    input[type="range"]:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .time-row {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    button {
      background: var(--card-hover);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    button:hover:not(:disabled) {
      background: #475569;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
      padding: 8px 22px;
    }

    button.primary:hover:not(:disabled) {
      background: var(--accent-hover);
      color: #fff;
    }

    /* Chỉnh tốc độ */
    .speed-box {
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      margin-bottom: 18px;
    }

    .speed-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .speed-header span {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .speed-value {
      color: var(--accent);
      font-size: 1rem;
      font-weight: 700;
    }

    .preset-speeds {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .preset-speeds button {
      padding: 6px 8px;
      font-size: 0.82rem;
      flex: 1;
      min-width: 52px;
    }

    .preset-speeds button.active {
      background: var(--accent);
      color: #0f172a;
      border-color: var(--accent);
    }

    .auto-reset {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      font-size: 0.83rem;
      color: var(--muted);
      cursor: pointer;
    }

    /* Danh sách phát theo thư mục - Hiển thị đầy đủ, không cắt */
    .playlist-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .playlist-header h2 {
      font-size: 1rem;
      font-weight: 600;
    }

    .upload-btn {
      font-size: 0.83rem;
      padding: 6px 12px;
      background: transparent;
      border: 1px dashed var(--accent);
      color: var(--accent);
      border-radius: 8px;
      cursor: pointer;
    }

    .upload-btn:hover {
      background: rgba(56, 189, 248, 0.1);
    }

    .folder-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .folder-group {
      flex-shrink: 0;
      background: #0f172a;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
    }

    .folder-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 14px;
      background: rgba(51, 65, 85, 0.45);
      cursor: pointer;
      user-select: none;
      font-weight: 600;
      font-size: 0.94rem;
      color: #fff;
    }

    .folder-header:hover {
      background: rgba(51, 65, 85, 0.75);
    }

    .folder-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .folder-items {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 10px;
    }

    .folder-group.collapsed .folder-items {
      display: none;
    }

    .folder-items li {
      padding: 10px 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      line-height: 1.35;
      transition: 0.15s;
    }

    .folder-items li:hover {
      border-color: var(--accent);
    }

    .folder-items li.active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
      color: var(--accent);
      font-weight: 600;
    }

    .status-msg {
      margin-top: 8px;
      font-size: 0.84rem;
      color: #f87171;
      display: none;
    }

    .exam-notice {
      margin-top: 8px;
      font-size: 0.84rem;
      color: var(--exam);
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Trình Đọc Audio</h1>
      <div class="mode-switch">
        <button id="normalModeBtn" class="active-normal">Chế độ Nghe</button>
        <button id="examModeBtn">Chức năng Thi (0.6x)</button>
      </div>
    </div>

    <!-- CHỨC NĂNG THI -->
    <div class="exam-panel" id="examPanel">
      <div class="exam-header">
        <span class="exam-title">CHẾ ĐỘ THI / LUYỆN NGHE</span>
        <span class="exam-timer" id="examTimerDisplay">00:00</span>
      </div>

      <div class="exam-grid">
        <div class="exam-field">
          <label for="examSpeedInput">Tốc độ thi (mặc định 0.6x)</label>
          <input type="number" id="examSpeedInput" value="0.6" min="0.25" max="2.5" step="0.05" />
        </div>
        <div class="exam-field">
          <label for="examDurationInput">Thời gian làm bài (phút)</label>
          <input type="number" id="examDurationInput" value="15" min="1" max="600" />
        </div>
        <div class="exam-field">
          <label for="examMaxPlays">Số lần nghe tối đa</label>
          <select id="examMaxPlays">
            <option value="0">Không giới hạn</option>
            <option value="1">1 lần</option>
            <option value="2" selected>2 lần</option>
            <option value="3">3 lần</option>
          </select>
        </div>
      </div>

      <div class="exam-options">
        <label>
          <input type="checkbox" id="lockSeekCheck" checked />
          Khóa thanh tua (chống tua nhanh/lùi)
        </label>
        <label>
          <input type="checkbox" id="lockSpeedCheck" />
          Cố định tốc độ thi (không cho đổi khi đang thi)
        </label>
      </div>

      <div class="exam-actions">
        <span class="exam-stats" id="examPlayCountDisplay">Đã nghe: 0 / 2 lần</span>
        <div>
          <button id="startExamBtn" class="btn-exam">▶ Bắt đầu Thi</button>
          <button id="stopExamBtn" style="display:none;">⏹ Kết thúc</button>
        </div>
      </div>
    </div>

    <!-- TRÌNH PHÁT CHÍNH -->
    <div class="now-playing">
      <div class="track-meta">
        <div class="track-title" id="trackTitle">Đang tải danh sách...</div>
        <span class="unlimited-badge">Không giới hạn thời lượng</span>
      </div>

      <div class="progress-container">
        <input type="range" id="seekBar" value="0" min="0" max="1000" step="1" />
        <div class="time-row">
          <span id="currentTime">00:00</span>
          <span id="realRemaining">Còn lại (thực tế): 00:00</span>
          <span id="duration">00:00</span>
        </div>
      </div>

      <div class="controls">
        <button id="prevBtn" title="Bài trước">⏮ Trước</button>
        <button id="rewindBtn" title="Lùi 5 giây">-5s</button>
        <button id="playPauseBtn" class="primary">▶ Phát</button>
        <button id="forwardBtn" title="Tiến 5 giây">+5s</button>
        <button id="nextBtn" title="Bài tiếp theo">Tiếp ⏭</button>
      </div>

      <div class="status-msg" id="errorMsg"></div>
      <div class="exam-notice" id="examNotice"></div>
    </div>

    <!-- TINH CHỈNH TỐC ĐỘ -->
    <div class="speed-box">
      <div class="speed-header">
        <span>Tốc độ đọc</span>
        <span class="speed-value" id="speedDisplay">0.60x</span>
      </div>

      <input type="range" id="speedSlider" min="0.25" max="2.5" step="0.05" value="0.6" />

      <div class="preset-speeds" id="presetButtons">
        <button data-speed="0.5">0.5x</button>
        <button data-speed="0.6" class="active">0.6x</button>
        <button data-speed="0.75">0.75x</button>
        <button data-speed="1">1.0x</button>
        <button data-speed="1.25">1.25x</button>
        <button data-speed="1.5">1.5x</button>
        <button data-speed="2">2.0x</button>
      </div>

      <label class="auto-reset">
        <input type="checkbox" id="autoResetCheck" checked />
        Tự động đặt lại về 0.6x khi chuyển sang file mới
      </label>
    </div>

    <!-- DANH SÁCH FILE AUDIO THEO THƯ MỤC -->
    <div class="playlist-header">
      <h2>Danh sách thư mục audio</h2>
      <label class="upload-btn">
        + Thêm file từ máy (mọi độ dài)
        <input type="file" id="fileInput" accept="audio/*" multiple hidden />
      </label>
    </div>

    <div class="folder-list" id="playlistEl"></div>
  </div>

  <audio id="audioPlayer" preload="metadata"></audio>

    const DEFAULT_SPEED = 0.6;
    let playlist = [...PRESET_PLAYLIST];
    let currentIndex = 0;
    let currentSpeed = DEFAULT_SPEED;
    let openFolder = "Đề 1 Máy trưởng";

    // Trạng thái Chức năng Thi
    let isExamMode = false;
    let isExamRunning = false;
    let examInterval = null;
    let examRemainingSeconds = 0;
    let examPlaysUsed = 0;

    // DOM Elements
    const audio = document.getElementById("audioPlayer");
    const trackTitle = document.getElementById("trackTitle");
    const seekBar = document.getElementById("seekBar");
    const currentTimeEl = document.getElementById("currentTime");
    const durationEl = document.getElementById("duration");
    const realRemainingEl = document.getElementById("realRemaining");
    const playPauseBtn = document.getElementById("playPauseBtn");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");
    const rewindBtn = document.getElementById("rewindBtn");
    const forwardBtn = document.getElementById("forwardBtn");

    const speedSlider = document.getElementById("speedSlider");
    const speedDisplay = document.getElementById("speedDisplay");
    const presetButtons = document.querySelectorAll("#presetButtons button");
    const autoResetCheck = document.getElementById("autoResetCheck");
    const playlistEl = document.getElementById("playlistEl");
    const fileInput = document.getElementById("fileInput");
    const errorMsg = document.getElementById("errorMsg");
    const examNotice = document.getElementById("examNotice");

    // Exam Elements
    const normalModeBtn = document.getElementById("normalModeBtn");
    const examModeBtn = document.getElementById("examModeBtn");
    const examPanel = document.getElementById("examPanel");
    const examTimerDisplay = document.getElementById("examTimerDisplay");
    const examSpeedInput = document.getElementById("examSpeedInput");
    const examDurationInput = document.getElementById("examDurationInput");
    const examMaxPlays = document.getElementById("examMaxPlays");
    const lockSeekCheck = document.getElementById("lockSeekCheck");
    const lockSpeedCheck = document.getElementById("lockSpeedCheck");
    const examPlayCountDisplay = document.getElementById("examPlayCountDisplay");
    const startExamBtn = document.getElementById("startExamBtn");
    const stopExamBtn = document.getElementById("stopExamBtn");

    function formatTime(sec) {
      if (isNaN(sec) || !isFinite(sec) || sec < 0) return "00:00";
      const totalSec = Math.floor(sec);
      const h = Math.floor(totalSec / 3600);
      const m = Math.floor((totalSec % 3600) / 60);
      const s = totalSec % 60;
      if (h > 0) {
        return `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
      }
      return `${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}`;
    }

    function applySpeed(rate) {
      const parsed = Math.min(2.5, Math.max(0.25, parseFloat(rate) || DEFAULT_SPEED));
      currentSpeed = parsed;
      audio.playbackRate = currentSpeed;
      audio.defaultPlaybackRate = currentSpeed;
      audio.preservesPitch = true;

      speedSlider.value = currentSpeed;
      speedDisplay.textContent = `${currentSpeed.toFixed(2)}x`;

      presetButtons.forEach((btn) => {
        const btnSpeed = parseFloat(btn.dataset.speed);
        btn.classList.toggle("active", Math.abs(btnSpeed - currentSpeed) < 0.01);
      });

      updateTimeUI();
    }

    function updateTimeUI() {
      const cur = audio.currentTime || 0;
      const dur = audio.duration || 0;
      currentTimeEl.textContent = formatTime(cur);
      durationEl.textContent = dur > 0 ? formatTime(dur) : "--:--";

      const remainingReal = dur > cur ? (dur - cur) / currentSpeed : 0;
      realRemainingEl.textContent = `Còn lại (thực tế): ${formatTime(remainingReal)}`;

      if (dur > 0 && isFinite(dur)) {
        seekBar.value = Math.round((cur / dur) * 1000);
      } else {
        seekBar.value = 0;
      }
    }

    function renderPlaylist() {
      playlistEl.innerHTML = "";
      const groups = new Map();

      playlist.forEach((item, idx) => {
        const folderName = item.folder || "Tài liệu chung";
        if (!groups.has(folderName)) groups.set(folderName, []);
        groups.get(folderName).push({ ...item, index: idx });
      });

      groups.forEach((items, folderName) => {
        const groupDiv = document.createElement("div");
        const isCollapsed = openFolder !== folderName;
        groupDiv.className = `folder-group${isCollapsed ? " collapsed" : ""}`;

        const headerDiv = document.createElement("div");
        headerDiv.className = "folder-header";
        headerDiv.innerHTML = `
          <span>📁 ${folderName}</span>
          <span class="folder-meta">${items.length} file <span>${isCollapsed ? "▸" : "▾"}</span></span>
        `;
        headerDiv.onclick = () => {
          openFolder = openFolder === folderName ? null : folderName;
          renderPlaylist();
        };

        const ul = document.createElement("ul");
        ul.className = "folder-items";

        items.forEach((item, localIdx) => {
          const li = document.createElement("li");
          li.className = item.index === currentIndex ? "active" : "";
          li.innerHTML = `<span>${localIdx + 1}. ${item.title}</span><span>${item.index === currentIndex ? "🔊" : "▶"}</span>`;
          li.onclick = () => {
            if (isExamRunning) {
              showExamNotice("Đang trong thời gian thi, không thể đổi sang file khác.");
              return;
            }
            loadTrack(item.index, true);
          };
          ul.appendChild(li);
        });

        groupDiv.appendChild(headerDiv);
        groupDiv.appendChild(ul);
        playlistEl.appendChild(groupDiv);
      });
    }

    function showExamNotice(msg) {
      examNotice.textContent = msg;
      examNotice.style.display = "block";
    }

    function clearExamNotice() {
      examNotice.style.display = "none";
    }

    function loadTrack(index, autoPlay = false) {
      if (playlist.length === 0) return;
      currentIndex = (index + playlist.length) % playlist.length;
      const track = playlist[currentIndex];

      errorMsg.style.display = "none";
      clearExamNotice();
      trackTitle.textContent = `[${track.folder || "Chung"}] ${track.title}`;
      audio.src = track.src.startsWith("blob:") ? track.src : encodeURI(track.src);

      if (track.folder) {
        openFolder = track.folder;
      }

      if (isExamMode) {
        applySpeed(examSpeedInput.value || DEFAULT_SPEED);
      } else if (autoResetCheck.checked) {
        applySpeed(DEFAULT_SPEED);
      } else {
        applySpeed(currentSpeed);
      }

      renderPlaylist();

      if (autoPlay) {
        audio.play().catch(() => {
          playPauseBtn.textContent = "▶ Phát";
        });
      } else {
        playPauseBtn.textContent = "▶ Phát";
      }
    }

    // ==========================
    // LOGIC CHỨC NĂNG THI
    // ==========================
    function updateExamControlsState() {
      const lockSeek = isExamRunning && lockSeekCheck.checked;
      seekBar.disabled = lockSeek;
      rewindBtn.disabled = lockSeek;
      forwardBtn.disabled = lockSeek;
      prevBtn.disabled = isExamRunning;
      nextBtn.disabled = isExamRunning;

      const lockSpeed = isExamRunning && lockSpeedCheck.checked;
      speedSlider.disabled = lockSpeed;
      presetButtons.forEach((b) => (b.disabled = lockSpeed));
    }

    function updateExamStatsUI() {
      const maxPlays = parseInt(examMaxPlays.value, 10);
      const maxText = maxPlays === 0 ? "Không giới hạn" : `${maxPlays} lần`;
      examPlayCountDisplay.textContent = `Đã nghe: ${examPlaysUsed} / ${maxText}`;
    }

    function switchMode(exam) {
      if (isExamRunning && !exam) {
        stopExam("Đã thoát chế độ thi.");
      }
      isExamMode = exam;
      normalModeBtn.className = exam ? "" : "active-normal";
      examModeBtn.className = exam ? "active-exam" : "";
      examPanel.classList.toggle("visible", exam);

      if (exam) {
        examSpeedInput.value = DEFAULT_SPEED;
        applySpeed(DEFAULT_SPEED);
        const mins = parseInt(examDurationInput.value, 10) || 15;
        examTimerDisplay.textContent = formatTime(mins * 60);
        examTimerDisplay.classList.remove("warning");
        examPlaysUsed = 0;
        updateExamStatsUI();
      } else {
        clearExamNotice();
        updateExamControlsState();
      }
    }

    function startExam() {
      audio.pause();
      audio.currentTime = 0;
      clearExamNotice();

      const examSpeed = parseFloat(examSpeedInput.value) || DEFAULT_SPEED;
      applySpeed(examSpeed);

      const mins = Math.max(1, parseInt(examDurationInput.value, 10) || 15);
      examRemainingSeconds = mins * 60;
      examPlaysUsed = 0;
      isExamRunning = true;

      startExamBtn.style.display = "none";
      stopExamBtn.style.display = "inline-block";
      examSpeedInput.disabled = true;
      examDurationInput.disabled = true;
      examMaxPlays.disabled = true;

      updateExamStatsUI();
      updateExamControlsState();
      examTimerDisplay.textContent = formatTime(examRemainingSeconds);
      examTimerDisplay.classList.remove("warning");

      clearInterval(examInterval);
      examInterval = setInterval(() => {
        examRemainingSeconds--;
        examTimerDisplay.textContent = formatTime(examRemainingSeconds);
        if (examRemainingSeconds <= 60) {
          examTimerDisplay.classList.add("warning");
        }
        if (examRemainingSeconds <= 0) {
          stopExam("⏰ Hết thời gian làm bài thi!");
        }
      }, 1000);

      examPlaysUsed = 1;
      updateExamStatsUI();
      audio.play().catch(() => {});
    }

    function stopExam(reason = "Đã kết thúc phần thi.") {
      isExamRunning = false;
      clearInterval(examInterval);
      audio.pause();

      startExamBtn.style.display = "inline-block";
      stopExamBtn.style.display = "none";
      examSpeedInput.disabled = false;
      examDurationInput.disabled = false;
      examMaxPlays.disabled = false;

      updateExamControlsState();
      showExamNotice(reason);
    }

    normalModeBtn.onclick = () => switchMode(false);
    examModeBtn.onclick = () => switchMode(true);
    startExamBtn.onclick = startExam;
    stopExamBtn.onclick = () => stopExam("Đã dừng bài thi.");

    examSpeedInput.onchange = () => {
      if (isExamMode && !isExamRunning) {
        applySpeed(examSpeedInput.value);
      }
    };

    examDurationInput.onchange = () => {
      if (isExamMode && !isExamRunning) {
        const mins = Math.max(1, parseInt(examDurationInput.value, 10) || 15);
        examTimerDisplay.textContent = formatTime(mins * 60);
      }
    };

    examMaxPlays.onchange = updateExamStatsUI;
    lockSeekCheck.onchange = updateExamControlsState;
    lockSpeedCheck.onchange = updateExamControlsState;

    // ==========================
    // SỰ KIỆN AUDIO & ĐIỀU KHIỂN
    // ==========================
    audio.addEventListener("loadedmetadata", () => {
      applySpeed(currentSpeed);
      updateTimeUI();
    });

    audio.addEventListener("timeupdate", updateTimeUI);

    audio.addEventListener("play", () => {
      applySpeed(currentSpeed);
      playPauseBtn.textContent = "⏸ Tạm dừng";
    });

    audio.addEventListener("pause", () => {
      playPauseBtn.textContent = "▶ Phát";
    });

    audio.addEventListener("ended", () => {
      if (isExamRunning) {
        const maxPlays = parseInt(examMaxPlays.value, 10);
        if (maxPlays > 0 && examPlaysUsed >= maxPlays) {
          showExamNotice(`Bạn đã dùng hết ${maxPlays} lượt nghe cho phép.`);
          playPauseBtn.textContent = "▶ Hết lượt nghe";
        } else {
          playPauseBtn.textContent = "▶ Nghe lượt tiếp theo";
        }
        return;
      }

      if (playlist.length > 1) {
        loadTrack(currentIndex + 1, true);
      } else {
        playPauseBtn.textContent = "▶ Phát lại";
      }
    });

    audio.addEventListener("error", () => {
      errorMsg.textContent = `Không thể tải file "${playlist[currentIndex]?.src}". Hãy kiểm tra lại tên file hoặc chờ GitHub Pages cập nhật.`;
      errorMsg.style.display = "block";
    });

    playPauseBtn.onclick = () => {
      if (audio.paused) {
        if (isExamRunning) {
          const maxPlays = parseInt(examMaxPlays.value, 10);
          if (audio.ended || audio.currentTime === 0) {
            if (examPlaysUsed > 0 && audio.ended) {
              if (maxPlays > 0 && examPlaysUsed >= maxPlays) {
                showExamNotice(`Đã hết ${maxPlays} lượt nghe tối đa.`);
                return;
              }
              examPlaysUsed++;
              updateExamStatsUI();
            } else if (examPlaysUsed === 0) {
              examPlaysUsed = 1;
              updateExamStatsUI();
            }
          }
        }
        audio.play();
      } else {
        audio.pause();
      }
    };

    prevBtn.onclick = () => loadTrack(currentIndex - 1, true);
    nextBtn.onclick = () => loadTrack(currentIndex + 1, true);
    rewindBtn.onclick = () => {
      audio.currentTime = Math.max(0, audio.currentTime - 5);
    };
    forwardBtn.onclick = () => {
      if (isFinite(audio.duration)) {
        audio.currentTime = Math.min(audio.duration, audio.currentTime + 5);
      } else {
        audio.currentTime += 5;
      }
    };

    seekBar.oninput = () => {
      if (audio.duration && isFinite(audio.duration)) {
        audio.currentTime = (seekBar.value / 1000) * audio.duration;
      }
    };

    speedSlider.oninput = () => applySpeed(speedSlider.value);

    presetButtons.forEach((btn) => {
      btn.onclick = () => applySpeed(btn.dataset.speed);
    });

    fileInput.onchange = (e) => {
      const files = Array.from(e.target.files);
      if (!files.length) return;
      const startIdx = playlist.length;
      files.forEach((file) => {
        playlist.push({
          folder: "File tải từ máy",
          title: file.name,
          src: URL.createObjectURL(file)
        });
      });
      loadTrack(startIdx, !isExamRunning);
    };

    // Khởi chạy ban đầu
    applySpeed(DEFAULT_SPEED);
    loadTrack(0, false);
  </script>
